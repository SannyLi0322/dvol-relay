name: dvol-relay

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch DVOL from Deribit
        run: python fetch_dvol.py data
      - name: Commit if changed
        run: |
          git config user.name "dvol-relay-bot"
          git config user.email "dvol-relay-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "dvol $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
